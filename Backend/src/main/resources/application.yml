spring:
  application:
    name: expense-tracker

  datasource:
    url: jdbc:h2:mem:expense_tracker;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 4000
